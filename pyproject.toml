[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vertex-cover-comparison"
version = "0.1.0"
description = "Exact and approximate minimum vertex cover comparison project"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vertex-cover = "vertex_cover.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vertex_cover*"]
